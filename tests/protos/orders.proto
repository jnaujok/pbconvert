syntax = "proto3";

package acme.v1;

import "sub/common.proto";
import "google/protobuf/timestamp.proto";

message Item {
  string sku = 1;
  acme.common.Money price = 2;
}

message Order {
  int64 id = 1;
  repeated Item items = 2;
  google.protobuf.Timestamp created_at = 3;

  message Note {
    string text = 1;
  }
  Note note = 4;
  map<string, string> labels = 5;
  bytes blob = 6;
}
